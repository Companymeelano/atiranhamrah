<?xml version="1.0" encoding="UTF-8"?>
<!--
  پسته — شخصیت زندهٔ M•REPORT 🥜 (نسخهٔ ۲ — بازسازی دقیق از تحلیل تصویر مرجع)
  
  ساختار (مطابق اجزای تشخیص‌داده‌شده در تصویر IMG_20260909_040525_001.jpg):
  · پوستهٔ تیرهٔ پسته در دو نیمهٔ باز (بالا-چپ و بالا-راست) — قهوه‌ای تیره #4A1F0D→#7B3E1E
  · بدن/مغز کرمی گرد و بزرگ در مرکز — #FBF2DA→#D9BE93
  · برگچهٔ سبز عمودی روی سر — #6E8F2A→#A9C43C
  · دو چشم غول‌پیکر براق مشکی (۲۲٪ ارتفاع صورت!) با هایلایت‌های سفید
  · لبخند پهن مشکی + زبان
  · دو دست سبز بالا برده در حال تکان‌دادن (دو بازوی سبز در تصویر مرجع)
  · دو پای سبز کوچک
  
  نسخهٔ زندهٔ این شخصیت (پلک‌زدن، خواب، پرش، پنج حالت چهره، تکان‌دادن دست،
  واکنش به لمس) در Pistachio.kt به‌صورت Canvas اجرا می‌شود.
  Milad Yaghoobi · Meelano Studio Design
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="halo" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#E6CB98" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#E6CB98" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shellL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B3E1E"/>
      <stop offset="100%" stop-color="#4A1F0D"/>
    </linearGradient>
    <linearGradient id="shellR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B3418"/>
      <stop offset="100%" stop-color="#3F1B0C"/>
    </linearGradient>
    <linearGradient id="body" x1="50" y1="22" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBF2DA"/>
      <stop offset="55%" stop-color="#EFDCB6"/>
      <stop offset="100%" stop-color="#D9BE93"/>
    </linearGradient>
    <linearGradient id="leaf" x1="58" y1="8" x2="50" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A9C43C"/>
      <stop offset="100%" stop-color="#6E8F2A"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8FA834"/>
      <stop offset="100%" stop-color="#66831F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- هالهٔ نور گرم — عمق با نور، نه سایه -->
  <circle cx="50" cy="55" r="49" fill="url(#halo)"/>

  <!-- نیمهٔ چپ پوستهٔ تیره — باز شده به بالا-چپ -->
  <path d="M50,12 C36,14 24,24 20,40 C17,52 22,66 34,74 C26,60 27,44 36,32 C42,24 48,18 56,16 Z"
        fill="url(#shellL)" stroke="#33150A" stroke-width="1.0"/>
  <!-- نیمهٔ راست پوستهٔ تیره — باز شده به بالا-راست -->
  <path d="M50,12 C64,14 76,24 80,40 C83,52 78,66 66,74 C74,60 73,44 64,32 C58,24 52,18 44,16 Z"
        fill="url(#shellR)" stroke="#33150A" stroke-width="1.0"/>

  <!-- برگچهٔ سبز روی سر — تیره‌پشت بدن -->
  <path d="M52,32 C48,26 47,18 51,10 C55,4 61,3 64,6 C60,8 57,13 57,20 C57,25 56,29 54,33 Z"
        fill="url(#leaf)" stroke="#546E1E" stroke-width="0.8"/>
  <path d="M53,31 C53,24 54,17 57,11" fill="none" stroke="#546E1E" stroke-width="0.8" stroke-linecap="round"/>

  <!-- بدن کرمی — مغز پسته -->
  <ellipse cx="50" cy="60" rx="31" ry="33" fill="url(#body)" stroke="#C9AC80" stroke-width="1.2"/>

  <!-- نور نقطه‌ای روی بدن -->
  <ellipse cx="38" cy="36" rx="12" ry="9" fill="url(#shine)" opacity="0.55"/>

  <!-- دست چپ سبز — بالا برده -->
  <path d="M27,64 C22,58 17,51 13,45" fill="none" stroke="url(#arm)" stroke-width="7" stroke-linecap="round"/>
  <!-- دست راست سبز — بالا برده (در حال تکان‌دادن!) -->
  <path d="M73,64 C78,58 83,51 87,45" fill="none" stroke="url(#arm)" stroke-width="7" stroke-linecap="round"/>

  <!-- پاهای سبز -->
  <path d="M43,91 L43,96" stroke="#5C7820" stroke-width="7" stroke-linecap="round"/>
  <path d="M57,91 L57,96" stroke="#5C7820" stroke-width="7" stroke-linecap="round"/>

  <!-- چشم چپ — غول‌پیکر و براق -->
  <ellipse cx="37" cy="54" rx="8.8" ry="10" fill="#241C10"/>
  <circle cx="34.4" cy="50.8" r="3.0" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="39.6" cy="57.6" r="1.2" fill="#FFFFFF" opacity="0.65"/>

  <!-- چشم راست — غول‌پیکر و براق (کمی بزرگ‌تر، مثل تصویر مرجع) -->
  <ellipse cx="63" cy="55" rx="9.8" ry="11" fill="#241C10"/>
  <circle cx="60" cy="51.4" r="3.3" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="66" cy="59.2" r="1.3" fill="#FFFFFF" opacity="0.65"/>

  <!-- لپ‌های نرم -->
  <ellipse cx="27" cy="66" rx="4.6" ry="2.8" fill="#F0C9A4" opacity="0.55"/>
  <ellipse cx="73" cy="66" rx="4.6" ry="2.8" fill="#F0C9A4" opacity="0.55"/>

  <!-- لبخند پهن مشکی + زبان -->
  <path d="M39,69 Q50,79 61,69 Q50,74 39,69 Z" fill="#241C10"/>
  <path d="M45,73.6 Q50,78 55,73.6 Q50,76.4 45,73.6 Z" fill="#D97C64"/>
</svg>
