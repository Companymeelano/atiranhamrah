<?xml version="1.0" encoding="UTF-8"?>
<!--
  پسته — شخصیت زندهٔ M•REPORT 🥜
  بازسازی دقیق و مشابه تصویر مرجع (تصویر بارگذاری‌شده در ریپو):
  پوستهٔ بادامی با گرادیان بژ واقعی، شکاف پوسته، برگچهٔ سر، مغز سبز
  خندان با چشمک تک‌چشمیِ امضا، لپ‌های گیج، دهان خنده با زبان و
  پاپیون برند. نسخهٔ زندهٔ این شخصیت (پلک‌زدن، پرش، پنج حالت چهره،
  واکنش به لمس) در Pistachio.kt به‌صورت Canvas اجرا می‌شود.
  Milad Yaghoobi · Meelano Studio Design
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6CB98" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#E6CB98" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="50" y1="5" x2="50" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6CB98"/>
      <stop offset="50%" stop-color="#D2AE79"/>
      <stop offset="100%" stop-color="#B08A55"/>
    </linearGradient>
    <linearGradient id="shellEdge" x1="50" y1="5" x2="50" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9A7A4C"/>
      <stop offset="100%" stop-color="#8A6B42"/>
    </linearGradient>
    <radialGradient id="kernel" cx="50" cy="33" r="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BBD68F"/>
      <stop offset="60%" stop-color="#8FB260"/>
      <stop offset="100%" stop-color="#7A9A50"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CD5F2"/>
      <stop offset="100%" stop-color="#5FB0DC"/>
    </linearGradient>
  </defs>

  <!-- هالهٔ نور گرم پشت پسته — عمق با نور، نه سایه -->
  <circle cx="50" cy="50" r="49" fill="url(#halo)"/>

  <!-- پوستهٔ بادامی — گرادیان بژ واقعی -->
  <path d="M50,5 C79,15 89,48 74,75 C64,91 36,91 26,75 C11,48 21,15 50,5 Z"
        fill="url(#shell)" stroke="url(#shellEdge)" stroke-width="1.7"/>

  <!-- برق نور روی پوسته -->
  <ellipse cx="41" cy="33" rx="11" ry="17" fill="url(#shine)"/>

  <!-- شکاف پوسته — خط باریک بالا -->
  <path d="M50,6 Q46,16 50.5,26" fill="none" stroke="#8A6B42" stroke-width="2.1" stroke-linecap="round"/>

  <!-- برگچهٔ سر پسته -->
  <path d="M50,8 Q57,0.5 66,4.5 Q58.5,11.5 50,8 Z" fill="#6F9A4E"/>
  <path d="M50,9 L48,4.5" fill="none" stroke="#5D7A40" stroke-width="1.5" stroke-linecap="round"/>

  <!-- مغز سبز — صحنهٔ صورت -->
  <ellipse cx="50" cy="39" rx="25" ry="19" fill="url(#kernel)"/>

  <!-- لپ‌های گیج -->
  <circle cx="34.6" cy="41" r="4.2" fill="#E2906B" fill-opacity="0.55"/>
  <circle cx="65.4" cy="41" r="4.2" fill="#E2906B" fill-opacity="0.55"/>

  <!-- چشم چپ — باز با برق چشم -->
  <circle cx="41" cy="35" r="4.4" fill="#FCF8EE"/>
  <circle cx="41" cy="35" r="2.2" fill="#3A2E1B"/>
  <circle cx="39.8" cy="34" r="0.8" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- چشم راست — چشمک خندان (امضای پسته!) -->
  <path d="M55,35.4 Q59,32 63,35.4" fill="none" stroke="#3A2E1B" stroke-width="1.9" stroke-linecap="round"/>

  <!-- ابروها — راستی بالا رفته از توّقی! -->
  <path d="M37.2,28.5 Q41,25.6 44.8,28.5" fill="none" stroke="#3A2E1B" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M55.2,25.3 Q59,22.4 62.8,25.3" fill="none" stroke="#3A2E1B" stroke-width="1.7" stroke-linecap="round"/>

  <!-- دهان خندهٔ باز + زبان -->
  <path d="M43.5,41.5 Q50,49.5 56.5,41.5 Z" fill="#3A2E1B"/>
  <path d="M47,45.4 Q50,49.6 53,45.4 Z" fill="#E2906B"/>

  <!-- پاپیون برند (در نسخهٔ زنده هم‌رنگ تم کاربر) -->
  <path d="M50,72 L42.5,67.6 Q40.8,72 42.5,76.4 Z" fill="#8A76E8" fill-opacity="0.92" stroke="#000000" stroke-opacity="0.10" stroke-width="0.7"/>
  <path d="M50,72 L57.5,67.6 Q59.2,72 57.5,76.4 Z" fill="#8A76E8" fill-opacity="0.92" stroke="#000000" stroke-opacity="0.10" stroke-width="0.7"/>
  <circle cx="50" cy="72" r="1.9" fill="#8A76E8"/>
  <circle cx="49.2" cy="71.2" r="0.7" fill="#FFFFFF" fill-opacity="0.55"/>

  <!-- برق کوچک روی لپ — جذابیت سه‌بعدی -->
  <ellipse cx="34.6" cy="41" rx="2.5" ry="1.3" fill="#FFFFFF" fill-opacity="0.32" transform="rotate(-18 34.6 41)"/>
</svg>
