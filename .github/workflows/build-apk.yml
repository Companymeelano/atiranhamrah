name: Build Android APK

on:
  push:
    branches: [arena/01a07aea-atiranhamrah, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure platform 35 & licenses (yes-piped, cannot hang)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-35" > /dev/null 2>&1 || true
          INSTALLED=$(sdkmanager --list_installed 2>/dev/null | grep -c "platforms;android-35" || true)
          echo "::warning::platforms-android-35-installed=$INSTALLED"

      # فونت وزیرمتن — اگر در ریپو نباشد دانلود و کامیت می‌شود
      - name: Fetch Vazirmatn fonts (if missing)
        run: |
          if [ -f app/src/main/res/font/vazirmatn_regular.ttf ]; then
            echo "fonts already in repo"; exit 0
          fi
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf"
          mirror="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@master/fonts/ttf"
          for w in Regular Medium SemiBold Bold Black; do
            out="app/src/main/res/font/vazirmatn_$(echo $w | tr 'A-Z' 'a-z').ttf"
            curl -fsSL --retry 3 -o "$out" "$base/Vazirmatn-$w.ttf" \
              || curl -fsSL --retry 3 -o "$out" "$mirror/Vazirmatn-$w.ttf" \
              || { echo "::error::font download failed: $w"; exit 1; }
          done
          ls -la app/src/main/res/font

      - name: Commit fonts to repo (first time only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/font
          if git diff --cached --quiet; then
            echo "no font changes"
          else
            git commit -m "افزودن فونت وزیرمتن (دانلود خودکار CI)"
            git push
          fi

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee gradle-build.log
          echo "exitstatus=$?" >> "$GITHUB_OUTPUT"

      - name: Surface build errors as annotations
        if: steps.build.outcome == 'failure'
        run: |
          echo "===== Kotlin/compile errors ====="
          grep -E "^e: |error: |FAILURE:|What went wrong|Caused by:" -A 2 gradle-build.log | head -80 || true
          echo "===== as annotations ====="
          grep -E "^e: |error: " gradle-build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line:0:600}"
          done
          exit 1

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AtiranHamrahViewer-v4.8.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create release with APK
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.8.1-debug
          name: "M•REPORT v4.8.1 — رفع باگ‌های اتصال: پشتیبانی IP:port و نوشتار SSMS، سه حالت رمزنگاری و عیب‌یابی دقیق"
          body: |
            نسخه ۲.۱.۰ — نمایشگر مدیریت دیتابیس آجیل و خشکبار

            **جدید در این نسخه:**
            - آیکن سه‌بعدی جدید (آجیل و خشکبار) + لوگوی داخل برنامه
            - ۴ تم جذاب: شب کهکشانی و زمرد سلطنتی (تیره لاکچری) + صبح شکوفه و یاقوت آبی (روشن)
            - فونت فارسی وزیرمتن در کل برنامه
            - بخش دمو با داشبورد مدیریتی: چارت ستونی/دونات/خطی متحرک + گزارش‌های مدیریتی
            - برندینگ Meelano Studio Design در صفحه ورود

            **نصب:** فایل `app-debug.apk` را دانلود و روی گوشی اندروید ۸ به بالا نصب کنید.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
