name: Server Probe

on:
  workflow_dispatch:
  push:
    branches: [arena/01a07aea-atiranhamrah, main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: TCP + TDS + TLS probe (python)
        run: |
          python3 - <<'PY'
          import socket, ssl
          host, port = "37.143.147.19", 1433
          # TCP
          try:
              s = socket.create_connection((host, port), timeout=10)
              print(f"::notice::PY-TCP {host}:{port} OPEN")
              s.close()
          except Exception as e:
              print(f"::error::PY-TCP FAILED: {e}")
              raise SystemExit(0)
          # TLS handshake روی پورت SQL — نسخهٔ مذاکره‌شده
          for name, lo, hi in [("TLS1.2", ssl.TLSVersion.TLSv1_2, ssl.TLSVersion.TLSv1_2),
                               ("TLS1.3", ssl.TLSVersion.TLSv1_3, ssl.TLSVersion.TLSv1_3)]:
              try:
                  ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
                  ctx.check_hostname = False
                  ctx.verify_mode = ssl.CERT_NONE
                  ctx.minimum_version = lo
                  ctx.maximum_version = hi
                  raw = socket.create_connection((host, port), timeout=10)
                  with ctx.wrap_socket(raw) as ts:
                      print(f"::notice::PY-TLS {name} OK proto={ts.version()}")
              except Exception as e:
                  print(f"::error::PY-TLS {name} FAILED: {type(e).__name__}: {e}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: JDBC login probe (all engines)
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          curl -fsSL -o mssql.jar https://repo1.maven.org/maven2/com/microsoft/sqlserver/mssql-jdbc/12.8.1.jre11/mssql-jdbc-12.8.1.jre11.jar
          curl -fsSL -o jtds.jar https://repo1.maven.org/maven2/net/sourceforge/jtds/jtds/1.3.1/jtds-1.3.1.jar
          cp "$GITHUB_WORKSPACE/probe/ServerProbe.java" .
          javac ServerProbe.java
          java -cp ".:mssql.jar:jtds.jar" ServerProbe 2>&1 || true
          echo "::notice::PROBE-DONE"
